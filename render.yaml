# render.yaml — Infraestructura como código para Render
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: llamadas-db
    databaseName: llamadas_crm
    user: crm_user
    plan: basic-256mb  # Postgres de pago en Render (PITR y backups)

services:
  # ── Backend API (Node.js / Express) ─────────────────────────────────────────
  - type: web
    name: llamadas-backend
    env: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: bash scripts/migrate-deploy-prod.sh && npx prisma db seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: llamadas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render genera un valor seguro automáticamente
      - key: FRONTEND_URL
        sync: false           # ej. https://crm.tudominio.com o varios orígenes separados por coma
      - key: CORS_EXTRA_ORIGINS
        sync: false           # opcional: https://llamadas-frontend.onrender.com durante migración

  # ── Frontend (React / Vite → Static Site) ───────────────────────────────────
  - type: web
    name: llamadas-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback (replaces Netlify-style public/_redirects, which Render ignores)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # CSP: se inyecta en index.html al hacer build desde VITE_API_URL (vite.config.ts).
    # No dupliques Content-Security-Policy aquí — dos políticas se combinan y bloquean fetch.
    envVars:
      - key: VITE_API_URL
        sync: false           # ej. https://api.tudominio.com (sin /api al final)
      - key: VITE_CSP_EXTRA_ORIGINS
        sync: false           # opcional: https://llamadas-backend.onrender.com durante migración
