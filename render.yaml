# render.yaml — Infraestructura como código para Render
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: llamadas-db
    databaseName: llamadas_crm
    user: crm_user
    plan: free          # cambiar a "starter" en producción real

services:
  # ── Backend API (Node.js / Express) ─────────────────────────────────────────
  - type: web
    name: llamadas-backend
    env: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push && npx ts-node src/seed.ts && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: llamadas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render genera un valor seguro automáticamente
      - key: FRONTEND_URL
        sync: false           # Se configura manualmente en el dashboard de Render

  # ── Frontend (React / Vite → Static Site) ───────────────────────────────────
  - type: web
    name: llamadas-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false           # Se configura manualmente con la URL del backend
